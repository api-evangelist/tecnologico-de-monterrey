---
aid: tecnologico-de-monterrey
name: Tecnológico de Monterrey
description: >-
  Tecnológico de Monterrey (ITESM) is a private Mexican multi-campus university
  system headquartered in Monterrey, ranked #185 in the QS World University
  Rankings 2025. It operates a public API developer portal at api.tec.mx that
  exposes institutional API products (such as student grade/academic-progress,
  student management, human-capital management, and billing APIs) behind
  registration and subscription approval, and a public Dataverse-based research
  open-data repository at datahub.tec.mx run by its Institute for the Future of
  Education, which serves a public Native REST API and an OAI-PMH metadata
  endpoint.
type: Index
accessModel:
  pricing: free
  onboarding: unknown
  trial: false
  try_now: false
  public: false
  label: Free
