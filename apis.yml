- aid: tecnologico-de-monterrey:ritec-oai
  name: RITEC Institutional Repository OAI-PMH (DSpace)
  description: >-
    RITEC, the Tecnológico de Monterrey institutional repository (repositorio.tec.mx), is a DSpace platform
    holding 80,000+ theses, articles, and academic works. It is listed in OpenDOAR, ROAR, and Sherpa with
    a documented OAI-PMH endpoint at /oai/request. Note: the host returned HTTP 403 to automated/programmatic
    clients during verification (WAF/bot protection), so the endpoint was not independently confirmed
    live, though registry records document it.
  humanURL: https://repositorio.tec.mx/
  baseURL: https://repositorio.tec.mx/oai/request
  tags:
  - Institutional Repository
  - DSpace
  - OAI-PMH
  - Open Access
  - Theses
  properties:
  - type: Documentation
    url: https://v2.sherpa.ac.uk/id/repository/3460
- aid: tecnologico-de-monterrey:developer-portal
  name: Tec de Monterrey API Developer Portal (Institutional APIs)
  description: >-
    Institutional API developer portal at api.tec.mx hosting named API products including academic progress
    / student grade APIs ("Boleta de Calificaciones del Alumno", "Gestión del Progreso Académico del Estudiante"),
    student management ("Gestión de Estudiantes"), human-capital management ("Gestión de Capital Humano"),
    and billing ("Proveedor Facturacion"). Access is gated: it requires account registration and per-product
    subscription approval, and is not openly browsable without authentication. No public endpoints were
    independently verified.
  humanURL: https://api.tec.mx/tec-de-monterrey/api/
  tags:
  - Education
  - Student Information System
  - Academic
  - Gated
