aid: tecnologico-de-monterrey
name: Tecnológico de Monterrey
x-type: university
x-category: Private Research University
description: >-
  Tecnológico de Monterrey (ITESM) is a private Mexican multi-campus university system
  headquartered in Monterrey, Nuevo León, ranked #185 in the QS World University Rankings 2025.
  Its programmable footprint is real but narrow, and it is entirely infrastructure the institution
  runs rather than software it wrote. Two research surfaces are live and public: a Dataverse 5.9
  research data repository at datahub.tec.mx and a DSpace 8 institutional repository (RITEC) at
  repositorio.tec.mx holding 86,310 works, each with a working OAI-PMH 2.0 endpoint. Its strongest
  institution-operated machine-readable surface is identity: two SAML 2.0 identity providers on its
  own domains (fs.itesm.mx AD FS, amfs.tec.mx NetIQ Access Manager) plus a Shibboleth Service
  Provider in front of RITEC. It is a registered DataCite consortium organization (ITESM, prefix
  10.57687, three repositories), a Crossref member (25649, prefix 10.46530) and is registered in ROR
  as 03ayjn504. What it does NOT have is a working public API programme: the gated institutional API
  developer portal formerly at api.tec.mx no longer resolves in DNS, and no OpenAPI in this profile
  is authored by the institution — the repository contracts are generated by the Dataverse and
  DSpace software and are recorded here as deployments, not as the institution's engineering.
