x-coverage:
  state: covered
  reason: covered
  detail: >-
    Eleven institution-operated, tenant or registry surfaces were probed live on 2026-09-01 and
    every one answered: two Dataverse/DSpace repository REST APIs, two OAI-PMH endpoints, three
    SAML surfaces on the institution's own domains, an Entra tenant federation record, and DataCite,
    Crossref and ROR registrations. Coverage is `covered` for surfaces, NOT for contracts: the
    institution authors no OpenAPI. Two negative findings matter as much as the positives. First,
    the gated institutional API developer portal at api.tec.mx — the one surface that would have
    been the institution's own API programme, carrying named products such as "Boleta de
    Calificaciones del Alumno", "Gestión de Estudiantes" and "Gestión de Capital Humano" — is now
    NXDOMAIN on 8.8.8.8, 1.1.1.1 and 9.9.9.9, while still being indexed by search engines; its
    pointers were removed as dead. Second, the 22 OpenAPIs previously held here were 22 tag-splits
    of ONE runtime-generated Dataverse document whose live title is "Deployed Resources" and whose
    servers are internal Payara hosts; they were removed under the shared-contract rule, along with
    44 collections and the artifacts derived from them.
