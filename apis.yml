- aid: tecnologico-de-monterrey:datahub-oai
  name: Tec de Monterrey Dataverse OAI-PMH Endpoint
  description: >-
    Public OAI-PMH 2.0 metadata harvesting endpoint for the Tecnológico de Monterrey Dataverse OAI Archive.
    Verified live via the Identify verb (repositoryName "Tecnológico de Monterrey Dataverse OAI Archive";
    adminEmail research.datahub@servicios.tec.mx). Supports standard verbs (Identify, ListRecords, ListIdentifiers,
    GetRecord) for harvesting dataset metadata.
  humanURL: https://datahub.tec.mx/
  baseURL: https://datahub.tec.mx/oai
  tags:
