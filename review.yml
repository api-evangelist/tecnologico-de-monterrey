  - date: '2026-09-01'
    rating: 3
    summary: >-
      University pipeline re-profile. Operator attribution was settled before anything was saved,
      and the result reverses the June reading in two directions at once. UP: RITEC
      (repositorio.tec.mx) is NOT bot-blocked at the API layer — it is a live DSpace 8.0 with a
      public HAL+JSON REST API over 86,310 objects and a working OAI-PMH endpoint at the DSpace 7+
      path /server/oai/request (the old /oai/request 301s there); and the institution operates a
      substantial, fully public identity surface that the June profile missed entirely — two SAML
      2.0 IdPs on its own domains (fs.itesm.mx AD FS, amfs.tec.mx NetIQ Access Manager) and a
      Shibboleth SP in front of RITEC, plus DataCite (ITESM, prefix 10.57687), Crossref (25649,
      prefix 10.46530) and ROR (03ayjn504) registrations. DOWN: api.tec.mx is now NXDOMAIN on three
      public resolvers — the institutional developer portal has been decommissioned since June — and
      the 22 OpenAPIs held here were 22 tag-splits of one runtime-generated Dataverse document whose
      live title is "Deployed Resources" with internal Payara servers. That contract is the
      Dataverse project's, not the institution's; it and 44 derived collections were removed. The
      institution authors no OpenAPI. Its footprint is real infrastructure it runs, not software it
      wrote, and the profile now says so.
