  - date: '2026-06-03'
    rating: 3
    summary: >-
      Verified a genuine institutional API presence with no fabrication. The
      datahub.tec.mx research open-data repository is a live, public Dataverse
      5.9 instance: /api/info/version returned version 5.9, /api/search returned
      200, and the OAI-PMH endpoint returned a valid Identify response naming the
      "Tecnológico de Monterrey Dataverse OAI Archive". The api.tec.mx developer
      portal is real and hosts multiple named API products (student grades,
      academic progress, student management, human-capital management, billing)
      but is gated behind login/subscription approval and refused automated
      fetches (connection reset / HTTP 000 to programmatic clients) while
      resolving in browsers; its endpoints could not be independently verified.
      GitHub org, LinkedIn school page, and official site all confirmed live.
